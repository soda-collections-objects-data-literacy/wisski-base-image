name: Publish WissKI Base Docker Images

on:
  push:
    branches: [2.x, 3.x]
    tags:
      - "*.*.*"

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64
  CONTEXT_DIRECTORY: .

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        mode: [production, development]
        include:
          - mode: production
            image_name: soda-collections-objects-data-literacy/wisski-base-image-production
          - mode: development
            image_name: soda-collections-objects-data-literacy/wisski-base-image-development
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine if latest release tag
        id: release
        run: |
          is_latest=false
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            current="${GITHUB_REF#refs/tags/}"
            latest=$(git tag -l '*.*.*' --sort=-v:refname | head -1)
            if [[ -n "$latest" && "$current" == "$latest" ]]; then
              is_latest=true
            fi
          fi
          echo "is_latest=$is_latest" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ env.REGISTRY }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest,enable=${{ steps.release.outputs.is_latest == 'true' }}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/heads/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.REGISTRY }}
      - name: Determine packages line
        id: packages
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            major="${version%%.*}"
            echo "line=${major}.x" >> "$GITHUB_OUTPUT"
          else
            echo "line=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT_DIRECTORY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MODE=${{ matrix.mode }}
            ${{ matrix.mode == 'development' && format('WISSKI_PACKAGES_LINE={0}', steps.packages.outputs.line) || '' }}
          platforms: ${{ env.PLATFORMS }}
          pull: true
          push: true
          provenance: false
