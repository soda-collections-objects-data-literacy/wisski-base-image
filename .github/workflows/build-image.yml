name: Publish WissKI Base Docker Images

on:
  push:
    branches: [2.x, 3.x]
    tags:
      - "*.*.*"

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64
  CONTEXT_DIRECTORY: .
  DRUPAL_VERSION: 11.3-php8.3-fpm-bookworm
  # Default wisski_base manifest version (drupal_packages repo) for branch
  # builds; tag builds use the tag itself (image version mirrors the
  # manifest version, so the folder must exist before tagging).
  DEFAULT_PACKAGES_VERSION: 3.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        mode: [production, development]
        include:
          - mode: production
            image_name: soda-collections-objects-data-literacy/wisski-base-image-production
          - mode: development
            image_name: soda-collections-objects-data-literacy/wisski-base-image-development
    steps:
      - uses: actions/checkout@v4
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ env.REGISTRY }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/2.x' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.REGISTRY }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT_DIRECTORY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MODE=${{ matrix.mode }}
            DRUPAL_VERSION=${{ env.DRUPAL_VERSION }}
            WISSKI_PACKAGES_VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || env.DEFAULT_PACKAGES_VERSION }}
          platforms: ${{ env.PLATFORMS }}
          pull: true
          push: true
          provenance: false
