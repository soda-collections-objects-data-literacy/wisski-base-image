name: Publish WissKI Base Docker Images

on:
  # main is the rolling development line (image tag :main); X.x branches are
  # only cut from a release tag to maintain an older major (image tag :X.x).
  push:
    branches: [main, "*.x"]
    tags:
      - "*.*.*"
  # Nightly rebuild of the rolling development image, so it picks up new
  # commits on the floating package lines (wisski 4.x-dev, recipes x.x-dev)
  # even when this repository does not change. Runs on the default branch.
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64
  CONTEXT_DIRECTORY: .

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        # The nightly run only refreshes the development image; production
        # images are pinned by their lock file and need no rebuild.
        mode: ${{ github.event_name == 'schedule' && fromJSON('["development"]') || fromJSON('["production","development"]') }}
    env:
      IMAGE_NAME: soda-collections-objects-data-literacy/wisski-base-image-${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Determine if latest release tag
        id: release
        run: |
          is_latest=false
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            current="${GITHUB_REF#refs/tags/}"
            # Release tags are plain X.Y.Z; ignore old v-prefixed tags, which would sort first.
            latest=$(git tag -l '[0-9]*.*.*' --sort=-v:refname | head -1)
            if [[ -n "$latest" && "$current" == "$latest" ]]; then
              is_latest=true
            fi
          fi
          echo "is_latest=$is_latest" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ steps.release.outputs.is_latest == 'true' }}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/heads/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.REGISTRY }}
      # Development package line and production package version come from the
      # Dockerfile ARG defaults (WISSKI_PACKAGES_LINE / WISSKI_PACKAGES_VERSION).
      # Do not derive them from the git tag major — image major can diverge
      # from the drupal_packages line (e.g. image 4.x still baking packages 3.x).
      - uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT_DIRECTORY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MODE=${{ matrix.mode }}
          platforms: ${{ env.PLATFORMS }}
          pull: true
          push: true
          provenance: false
