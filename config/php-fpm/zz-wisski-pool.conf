; WissKI PHP-FPM pool tuning (applies to production and development images so
; staging instances show production-like concurrency behind Varnish).
[www]
pm = dynamic
pm.max_children = 15
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
request_terminate_timeout = 300
