; PHP-FPM listens on a UNIX socket consumed by nginx (see config/nginx/drupal.conf).
; This file replaces the base image's TCP listen (port 9000). The zzz- prefix
; sorts last in the php-fpm.d include glob, so these directives always win
; regardless of where the base image defines its defaults.
[www]
listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
