; PHP sessions are stored in Redis (database 2; Drupal caches use the
; databases configured by the redis module via redis.settings.php).
; REDIS_HOST and REDIS_PORT are validated as required by the entrypoint and
; substituted by the PHP ini parser at process start, keeping the session
; store aligned with the cache backend configuration in redis.settings.php.
session.save_handler = redis
session.save_path = "tcp://${REDIS_HOST}:${REDIS_PORT}?database=2"

; Session locking: retry up to 100 times, waiting 5000 microseconds (5 ms)
; between attempts (~0.5 s worst case). Waiting forever can freeze ajax.
redis.session.locking_enabled = 1
redis.session.lock_retries = 100
redis.session.lock_wait_time = 5000
